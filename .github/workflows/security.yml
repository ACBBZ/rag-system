name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 18 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[security]'
      - run: bandit -c pyproject.toml -r app rag
      - name: Dependency audit
        continue-on-error: true
        run: pip-audit --format json --output pip-audit.json
      - run: cyclonedx-py environment --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit.json
            sbom.json
