[project]
name = "rag-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "fastapi>=0.111",
  "httpx>=0.27",
  "minio>=7.2",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pillow>=10.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pymilvus>=2.4",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.30",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]
eval = [
  "langchain-community>=0.3,<0.4",
  "openai>=1.0",
  "ragas==0.4.3",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "rag",
  "rag.evaluation",
  "rag.ingestion",
  "rag.models",
  "rag.retrieval",
  "rag.storage",
  "rag.tenants",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"rag/authz.py" = ["SIM102"]
"rag/storage/milvus_collection_manager.py" = ["BLE001"]
"rag/storage/repositories.py" = ["F401", "I001"]
"rag/storage/vector_resources.py" = ["UP037"]
