[project]
name = "rag-system"
version = "0.2.0"
description = "Production-oriented multi-tenant RAG platform with asynchronous ingestion, hybrid retrieval, verifiable citations, RAGAS evaluation, and observability."
readme = "README.en.md"
license = { file = "LICENSE" }
authors = [{ name = "ACBBZ" }]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "fastapi",
  "milvus",
  "postgresql",
  "ragas",
  "multi-tenant",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "minio>=7.2,<8",
  "openpyxl>=3.1,<4",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "pandas>=2.2,<4",
  "pillow>=10.4,<13",
  "prometheus-client>=0.20,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymilvus>=2.4,<4",
  "pypdf>=4.3,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tiktoken>=0.7,<1",
  "uvicorn[standard]>=0.30,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
]
eval = [
  "langchain-community>=0.3,<0.4",
  "openai>=1.0,<3",
  "ragas==0.4.3",
]
security = [
  "bandit[toml]>=1.7,<2",
  "pip-audit>=2.7,<3",
  "cyclonedx-bom>=5,<8",
]
load = ["locust>=2.31,<3"]

[project.scripts]
rag-worker = "rag.ingestion.worker_main:main"
rag-eval = "rag.evaluation.runner:main"

[project.urls]
Homepage = "https://github.com/ACBBZ/rag-system"
Repository = "https://github.com/ACBBZ/rag-system"
Documentation = "https://github.com/ACBBZ/rag-system#readme"
Issues = "https://github.com/ACBBZ/rag-system/issues"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "rag",
  "rag.evaluation",
  "rag.ingestion",
  "rag.models",
  "rag.retrieval",
  "rag.storage",
  "rag.tenants",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL, MinIO, Milvus, API, worker, and model fixtures",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"rag/authz.py" = ["SIM102"]
"rag/storage/milvus_collection_manager.py" = ["BLE001"]
"rag/storage/repositories.py" = ["F401", "I001"]
"rag/storage/vector_resources.py" = ["UP037"]
"migrations/versions/*.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
